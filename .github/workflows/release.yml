name: Release

# release-please on main, then an attested npm publish that waits for 2FA
# approval (`npm stage approve`). The steps are voidflow's tool-release.yml.
# npm trusted publishing for @taraxvoid/voidlink must name THIS file
# (release.yml) and the `npm` environment.
#
# The pin is the voidflow `next` commit that merged taraxvoid/voidflow#359.
# Move it to the first release tag that includes it (Renovate keeps it
# current after).

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish to npm (e.g. v0.1.0)
                required: true
                type: string
            dry-run:
                description: Run the publish steps with --dry-run (nothing is published)
                required: false
                default: false
                type: boolean

permissions: {}

jobs:
    release:
        uses: taraxvoid/voidflow/.github/workflows/tool-release.yml@be2660989517ab47927f66e26f5887feb78fc848 # voidflow next, after #359
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            attestations: write
        with:
            release-bot-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
            tag: ${{ inputs.tag }}
            dry-run: ${{ inputs.dry-run == true }}
        secrets:
            release-bot-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
