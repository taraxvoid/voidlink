# Written by voidflow v1.0.0-next.4: https://www.npmjs.com/package/@taraxvoid/voidflow
# Set up a repo the same way: npx @taraxvoid/voidflow init --kind tool
name: CI
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: [main]
    # Add `merge_group:` here if you use a merge queue.
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

jobs:
    validate:
        uses: taraxvoid/voidflow/.github/workflows/tool-ci.yml@2a0d7726b9dd3446a831a04dbb1d0f879b22d2b5 # v1.0.0-next.4

